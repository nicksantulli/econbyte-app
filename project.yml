# XcodeGen spec — the source of truth for the Xcode project.
# The committed EconByte.xcodeproj uses an Xcode 16 synchronized folder
# group (PBXFileSystemSynchronizedRootGroup), so new .swift files added under
# EconByte/ are picked up automatically without re-running xcodegen.
name: EconByte
options:
  bundleIdPrefix: com.nsantulli
  deploymentTarget:
    iOS: "16.6"
  createIntermediateGroups: true
packages:
  # AdMob interstitials (see EconByte/Services/AdManager.swift). DEBUG uses
  # Google's TEST unit; RELEASE uses the Owner-provided unit.
  # Pinned EXACTLY, like the other two: a `majorVersion` range let any 12.x
  # resolve, so the ad SDK that shipped could differ from the one that was
  # reviewed. The app declares NSPrivacyTracking = true and prompts for ATT once
  # per install (1.1.2 build 13, App Review 5.1.2(i)); this SDK is the reason for
  # both, so the exact pin is a tracking claim as well as a reproducibility one.
  # 12.14.0 is the reviewed version; Package.resolved is committed beside it.
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    exactVersion: 12.14.0
  # Product analytics. The vendor SDK is touched only by
  # EconByte/Services/PostHogTelemetryTransport.swift, behind the
  # TelemetryTransporting seam. It is inert unless Config/Secrets.xcconfig
  # supplies POSTHOG_API_KEY (surfaced as Info.plist EBPostHogAPIKey) — a nil key
  # means the SDK is never initialized. With a key it is OFF until the user
  # opts in in Settings (RECONCILED 1.1.2 — version 1.1 told users on the App
  # Store that analytics and diagnostics are opt-in and off by default).
  # Project "econbyte" (NEVER reuse Table Talk's or VibeRater's PostHog project).
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    exactVersion: 3.71.4
  # Crash diagnostics only. Touched only by
  # EconByte/Services/SentryDiagnosticsTransport.swift, behind the
  # DiagnosticsTransporting seam. Inert unless Config/Secrets.xcconfig supplies
  # SENTRY_DSN (Info.plist EBSentryDSN); with a DSN it is still OFF until the
  # user opts in to crash diagnostics in Settings (RECONCILED 1.1.2). No session
  # replay, no tracing, crash-only. Project "econbyte".
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    exactVersion: 8.58.4
settings:
  base:
    # 1.1.2 / build 12. Builds 9 and 10 are already uploaded and neither carries
    # the 1.1 curriculum; build 11 carried it but dropped the Settings
    # "Analytics ID" row the App Privacy answers promise, so 12 is the build
    # that restores it. Keep these in step with EconByte.xcodeproj/project.pbxproj — the
    # archived Info.plist is what App Store Connect reads, and this file only
    # reproduces the project. EconByte is a COMMITTED-pbxproj app: this file is
    # documentation, never a generator input (never run xcodegen here).
    MARKETING_VERSION: "1.1.3"
    CURRENT_PROJECT_VERSION: "14"
    DEVELOPMENT_TEAM: "" # Owner fills in for signing — never hardcode here
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: NO
  configs:
    Debug:
      # EconByteTests uses `@testable import EconByte`, which needs this.
      # Mirrors the committed pbxproj so the two never drift.
      ENABLE_TESTABILITY: YES
targets:
  EconByte:
    type: application
    platform: iOS
    # Committed base xcconfig with EMPTY instrumentation defaults; it optionally
    # includes the gitignored Config/Secrets.xcconfig. Never commit real values.
    configFiles:
      Debug: Config/Instrumentation.xcconfig
      Release: Config/Instrumentation.xcconfig
    # 1.1.3: "Instrumentation key gate" run-script phase (first phase of the app
    # target in the committed pbxproj, id KG0000000000000000000001). A Release
    # iphoneos build fails when POSTHOG_API_KEY is empty unless
    # EB_ALLOW_UNKEYED_RELEASE=YES is passed. Mirrored here for documentation;
    # the committed project is authoritative (never run xcodegen).
    preBuildScripts:
      - name: Instrumentation key gate
        shell: /bin/sh
        script: |
          if [ "${CONFIGURATION}" = "Release" ] && [ "${PLATFORM_NAME}" = "iphoneos" ]; then
            if [ -z "${POSTHOG_API_KEY}" ] && [ "${EB_ALLOW_UNKEYED_RELEASE}" != "YES" ]; then
              echo "error: POSTHOG_API_KEY is empty in a Release device build (see Config/Secrets.xcconfig.example), or pass EB_ALLOW_UNKEYED_RELEASE=YES."
              exit 1
            fi
          fi
    sources:
      - path: EconByte
    dependencies:
      - package: GoogleMobileAds
      - package: PostHog
      - package: Sentry
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nsantulli.econbyte
        INFOPLIST_FILE: EconByte/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1" # iPhone only
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  EconByteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EconByteTests
    dependencies:
      - target: EconByte
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nsantulli.econbyte.tests
        GENERATE_INFOPLIST_FILE: YES   # override the project-wide NO for the test bundle
        TARGETED_DEVICE_FAMILY: "1"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/EconByte.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/EconByte"

  EconByteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: EconByteUITests
    dependencies:
      - target: EconByte
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nsantulli.econbyte.uitests
        GENERATE_INFOPLIST_FILE: YES   # override the project-wide NO for the test bundle
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: EconByte

fileGroups:
  - EconByte.storekit   # local StoreKit config (dev/test only, not bundled into the app)
  - Config/Instrumentation.xcconfig

schemes:
  EconByte:
    build:
      targets:
        EconByte: all
        EconByteTests: [test]
        EconByteUITests: [test]
    run:
      # Lets the Owner buy/restore IAPs in the simulator without App Store Connect.
      storeKitConfiguration: EconByte.storekit
    test:
      targets:
        - EconByteTests
        - EconByteUITests
